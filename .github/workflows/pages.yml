name: Publish to gh-pages

# Copies public/ from dev to the root of the gh-pages branch.
# GitHub Pages is set to "Deploy from a branch: gh-pages / (root)".

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          path: src

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Copy public/ to gh-pages
        run: |
          find site -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a src/public/. site/
          touch site/.nojekyll

      - name: Stamp build info (version badge)
        run: |
          version="$(sed -n "s/^export const APP_VERSION = '\(.*\)';/\1/p" src/public/client.js)"
          node src/tools/build-info.mjs "$version" > site/build-info.js
          cat site/build-info.js

      - name: Commit and push
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "Publish ${GITHUB_SHA::7} from dev"
          git push origin gh-pages
