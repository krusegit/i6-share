name: Publish native hub and phone PWA

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  native:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            rid: linux-x64
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - run: npm ci
      - run: npm run check
      - name: Compile Native AOT on the target architecture
        run: npm run build:hub
      - name: Exercise the native executable
        env:
          I6_NATIVE_BINARY: ${{ github.workspace }}/dist/native/${{ matrix.rid }}/i6-share-hub
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: dist/public/downloads/
          if-no-files-found: error

  publish:
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: src
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: site
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
        working-directory: src
      - run: npm run build
        working-directory: src
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: src/dist/public/downloads
      - name: Verify native archives and create download catalog
        working-directory: src
        run: node_modules/.bin/tsx tools/cli.ts release:manifest dist/public/downloads
      - name: Publish compiled phone site and native downloads
        run: |
          set -euo pipefail
          find site -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a src/dist/public/. site/
          touch site/.nojekyll
      - name: Commit and push
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish native hub and PWA from ${GITHUB_SHA::7}"
          git push origin gh-pages
